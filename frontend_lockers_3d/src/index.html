<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SSRAirport Smart Lockers — 3D Digital Twin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.152.2/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="left">
    <h2>Locker Control</h2>
    <div class="controls">
      <label>Rows <input id="rows" type="number" min="1" max="10" value="3"></label>
      <label>Cols <input id="cols" type="number" min="1" max="12" value="8"></label>
      <label>Levels <input id="levels" type="number" min="1" max="4" value="2"></label>
      <button id="btnApply">Apply Grid</button>
      <hr>
      <button id="btnAutoBook">Simulate Bookings</button>
      <button id="btnClear">Clear Bookings</button>
      <hr>
      <h4>Selected Locker</h4>
      <div id="sel">None</div>
      <button id="btnOpen">Open / Slide</button>
      <button id="btnSetPriority">Toggle Priority</button>
      <button id="btnMaintenance">Toggle Maintenance</button>
      <hr>
      <h4>Appearance</h4>
      <label>Animation Speed <input id="animSpeed" type="range" min="0.2" max="2" step="0.1" value="1"></label>
      <label><input id="cbPalette" type="checkbox"> Color-blind mode</label>
    </div>
  </div>
  <div id="center"><canvas id="scene"></canvas></div>
  <div id="right">
    <h3>Analytics</h3>
    <div id="metrics">Lockers: 0</div>
    <h4>Events</h4>
    <div id="events"></div>
    <hr>
    <button id="btnExport">Export Config / Logs</button>
  </div>
  <script src="locker.js"></script>
  <script src="app.js"></script>
</body>
</html>
