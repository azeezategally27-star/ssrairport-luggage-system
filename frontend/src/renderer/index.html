<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SSRAirport Mini LangChain Graph</title>
    <style>
      body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; }
      #left { width: 220px; padding: 10px; background: #f4f4f4; box-sizing: border-box; }
      #center { flex: 1; position: relative; }
      #right { width: 320px; padding: 10px; background: #fff; box-sizing: border-box; border-left: 1px solid #ddd; }
      #cy { position: absolute; top:0; bottom:0; left:0; right:0; }
      button { display:block; width:100%; margin:6px 0; padding:8px; }
      pre { height: 60vh; overflow:auto; background:#111; color:#0f0; padding:8px; }
    </style>
    <script src="https://unpkg.com/cytoscape@3.24.0/dist/cytoscape.min.js"></script>
  </head>
  <body>
    <div id="left">
      <h3>Biometric Panel</h3>
      <button id="btnScanFace">Scan Face</button>
      <button id="btnRegister">Register Biometric</button>
      <button id="btnVerify">Verify Passenger</button>
      <button id="btnLogs">View Audit Log</button>
      <hr>
      <h4>Status</h4>
      <div id="status">Not connected</div>
    </div>
    <div id="center">
      <div id="cy"></div>
    </div>
    <div id="right">
      <h3>Agent Details / Logs</h3>
      <div id="agentDetail">Select a node to view details.</div>
      <h4>Raw Response</h4>
      <pre id="raw">--</pre>
    </div>
    <script src="index.js"></script>
  </body>
</html>
