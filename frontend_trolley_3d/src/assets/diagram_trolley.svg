    <rect x="20" y="20" width="220" height="360" rx="10" fill="#ffeef8" stroke="#ffd6ec" />
    <text x="130" y="50" text-anchor="middle" fill="#333">Controls</text>
    <rect x="260" y="20" width="480" height="260" rx="10" fill="#fff" stroke="#ffd6ec" />
