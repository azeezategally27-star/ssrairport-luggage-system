<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SSRAirport 3D Ledger (Pink Demo)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.152.2/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="left">
    <h2>3D Ledger — Luggage</h2>
    <div class="controls">
      <label>Passenger ID <input id="passengerId" value="P001"></label>
      <label>Luggage ID <input id="luggageId" value="L001"></label>
      <label>Event
        <select id="eventType">
          <option>Check-in</option>
          <option>Security Scan</option>
          <option>Loaded</option>
          <option>Cleared</option>
        </select>
      </label>
      <button id="btnAdd">Add Block</button>
      <button id="btnRandom">Add Random</button>
      <button id="btnValidate">Validate Chain</button>
      <button id="btnTamper">Simulate Tamper</button>
      <button id="btnExport">Export Ledger</button>
    </div>
    <div class="log">
      <h4>Selected Block</h4>
      <pre id="blockDetail">(none)</pre>
    </div>
  </div>
  <div id="center">
    <canvas id="scene"></canvas>
  </div>
  <div id="right">
    <h3>Ledger Controls</h3>
    <p>Cute pink theme demo. Use mouse to rotate the scene. Click a block to inspect.</p>
    <img src="assets/screenshot_3d.svg" alt="screenshot" style="width:100%">
  </div>
  <script src="ledger.js"></script>
  <script src="app.js"></script>
</body>
</html>
